customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(),
          interest-cohort=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com;
          style-src 'self' https://fonts.googleapis.com; font-src 'self'
          https://fonts.gstatic.com; img-src 'self' data:
          https://www.googletagmanager.com https://*.google-analytics.com;
          connect-src 'self'
          https://4s7uc7iyyeh7p4sknfpo6agllq0ahdff.lambda-url.us-east-1.on.aws
          https://*.google-analytics.com https://*.analytics.google.com
          https://www.googletagmanager.com; object-src 'none'; base-uri 'self';
          form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
  - pattern: "**/*.html"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: /
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "**/*.css"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "**/*.js"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "**/*.svg"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Self-hosted fonts: fingerprinted names (make_fonts.py), so a year is safe
  - pattern: "**/*.woff2"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Frank's sprites: the filename changes whenever he does, so a year is safe
  - pattern: "**/*.webp"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Tab and iPhone icons: linked with a version code, so a year is safe
  - pattern: favicon-*.png
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: apple-touch-icon.png
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Android app icons and the meeting backgrounds: plain filenames, so a day
  - pattern: icon-*.png
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: side-kit/backgrounds/*
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: og/*
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: "**/*.ico"
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: "**/*.webmanifest"
    headers:
      - key: Cache-Control
        value: public, max-age=86400
  - pattern: "**/*.txt"
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: "**/*.xml"
    headers:
      - key: Cache-Control
        value: public, max-age=3600
